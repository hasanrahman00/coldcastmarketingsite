<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (raster + svg) — covers browser tabs, Google search results & mobile home screens -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Tints mobile browser chrome. This is the app-frame graphite, NOT the lime
         accent: theme-color paints the whole browser bar, and lime there would be
         a wall of #ccff00 rather than an accent. -->
    <meta name="theme-color" content="#0f1214" />

    <!-- Primary SEO — per-page title/description/canonical/keywords are injected at
         runtime by the Seo component (src/components/Seo.jsx) and baked into the
         static HTML at build time by scripts/prerender.mjs. The tags here are GLOBAL
         defaults / no-JS fallbacks only; the page title is replaced per route, so do
         NOT add a static description or canonical here or it would duplicate Seo's. -->
    <title>Coldcast — The Safest LinkedIn Sales Navigator Scraper</title>
    <meta name="author" content="Coldcast" />
    <meta name="application-name" content="Coldcast" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph — og:title/og:url/og:description are set per-page by <Seo>; only
         the site-level defaults (type, name, locale, image) live here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coldcast" />
    <meta property="og:locale" content="en_US" />
    <!-- [PLACEHOLDER] Replace with a real 1200x630 share image at /og-image.png -->
    <meta property="og:image" content="https://www.coldcast.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coldcast — account-safe LinkedIn Sales Navigator scraper" />

    <!-- Twitter — twitter:title/description are set per-page by <Seo>. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- [PLACEHOLDER] add your real @handle -->
    <meta name="twitter:site" content="@coldcast" />
    <meta name="twitter:creator" content="@coldcast" />
    <meta name="twitter:image" content="https://www.coldcast.io/og-image.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: brand, site & product -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.coldcast.io/#organization",
            "name": "Coldcast",
            "url": "https://www.coldcast.io/",
            "logo": "https://www.coldcast.io/favicon-512x512.png", "image": "https://www.coldcast.io/images/coldcast-b2b-lead-list-builder.png",
            "description": "Coldcast is an account-safe LinkedIn Sales Navigator scraper that exports and enriches leads — verified emails, phone numbers and buying-intent signals — from your own browser."
          },
          {
            "@type": "WebSite",
            "@id": "https://www.coldcast.io/#website",
            "url": "https://www.coldcast.io/",
            "name": "Coldcast",
            "description": "Account-safe LinkedIn Sales Navigator scraper and lead-enrichment tool.",
            "publisher": { "@id": "https://www.coldcast.io/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.coldcast.io/#software",
            "name": "Coldcast",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Sales Intelligence / Lead Generation",
            "operatingSystem": "Google Chrome (browser extension)",
            "url": "https://www.coldcast.io/",
            "publisher": { "@id": "https://www.coldcast.io/#organization" },
            "description": "Export leads from LinkedIn Sales Navigator with verified emails, phone numbers and buying-intent signals — up to 20,000 a day — through your own browser session, so your account stays safe. Waterfall enrichment across Lusha, SalesQL and ContactOut; clean CSV / XLSX export to your CRM or sequencer.",
            "featureList": [
              "One-click export of any Sales Navigator search",
              "Waterfall email & phone enrichment (Lusha, SalesQL, ContactOut)",
              "Verified, validated emails — not guesses",
              "Buying-intent signals on every lead",
              "Account-safe: runs in your own browser at human pace",
              "Up to ~20,000 leads per account per day",
              "Clean, de-duplicated CSV / XLSX export"
            ],
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "0",
              "highPrice": "49",
              "offerCount": "3"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
