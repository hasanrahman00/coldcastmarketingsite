<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (raster + svg) — covers browser tabs, Google search results & mobile home screens -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Tints mobile browser chrome. This is the app-frame graphite, NOT the lime
         accent: theme-color paints the whole browser bar, and lime there would be
         a wall of #ccff00 rather than an accent. -->
    <meta name="theme-color" content="#0f1214" />

    <!-- Primary SEO — per-page title/description/canonical/keywords are injected at
         runtime by the Seo component (src/components/Seo.jsx) and baked into the
         static HTML at build time by scripts/prerender.mjs. The tags here are GLOBAL
         defaults / no-JS fallbacks only; the page title is replaced per route, so do
         NOT add a static description or canonical here or it would duplicate Seo's. -->
    <title>Coldcast — The Safest LinkedIn Sales Navigator Scraper</title>
    <meta name="author" content="Coldcast" />
    <meta name="application-name" content="Coldcast" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph — og:title/og:url/og:description are set per-page by <Seo>; only
         the site-level defaults (type, name, locale, image) live here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coldcast" />
    <meta property="og:locale" content="en_US" />
    <!-- [PLACEHOLDER] Replace with a real 1200x630 share image at /og-image.png -->
    <meta property="og:image" content="https://www.coldcast.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coldcast — account-safe LinkedIn Sales Navigator scraper" />

    <!-- Twitter — twitter:title/description are set per-page by <Seo>. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- [PLACEHOLDER] add your real @handle -->
    <meta name="twitter:site" content="@coldcast" />
    <meta name="twitter:creator" content="@coldcast" />
    <meta name="twitter:image" content="https://www.coldcast.io/og-image.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts for the enrich-style clone pages (/ and /pricing): Plus Jakarta
         Sans (headings), Geist (body), Geist Mono (labels/code). Used only under
         the scoped `.cc` wrapper; harmless on other routes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: brand, site & product. Aligned with the live page —
         own logged-in session, 10-provider waterfall, $3/$30/$10 credit packs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.coldcast.io/#organization",
            "name": "Coldcast",
            "alternateName": ["Coldcast.io", "Coldcast Sales Navigator Scraper"],
            "url": "https://www.coldcast.io/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.coldcast.io/favicon-512x512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://www.coldcast.io/og-image.png",
            "description": "Coldcast is an account-safe LinkedIn Sales Navigator, Apollo and ZoomInfo scraper with built-in waterfall email enrichment and verification for B2B cold outreach.",
            "email": "contact@coldcast.io",
            "sameAs": [
              "https://www.linkedin.com/company/coldcast-io/",
              "https://www.youtube.com/@coldcastio",
              "https://chromewebstore.google.com/detail/bljolejpindiokpikdpalhofcbiphfoi"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "contact@coldcast.io",
              "availableLanguage": "English"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.coldcast.io/#website",
            "url": "https://www.coldcast.io/",
            "name": "Coldcast",
            "alternateName": "Coldcast.io",
            "description": "Account-safe LinkedIn Sales Navigator scraper with waterfall email enrichment and verification.",
            "publisher": { "@id": "https://www.coldcast.io/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.coldcast.io/#software",
            "name": "Coldcast",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Sales Intelligence / Lead Generation",
            "operatingSystem": "Web, Google Chrome",
            "browserRequirements": "Requires Google Chrome",
            "url": "https://www.coldcast.io/",
            "downloadUrl": "https://chromewebstore.google.com/detail/bljolejpindiokpikdpalhofcbiphfoi",
            "screenshot": "https://www.coldcast.io/images/coldcast-b2b-lead-list-builder.png",
            "publisher": { "@id": "https://www.coldcast.io/#organization" },
            "description": "Export leads from LinkedIn Sales Navigator, Apollo and ZoomInfo from your own logged-in session at human pace, find and verify work emails through a 10-provider waterfall, and export a send-ready CSV or push straight to HubSpot, Salesforce, Instantly, Smartlead or Lemlist.",
            "featureList": [
              "Export any Sales Navigator lead search or saved list",
              "Apollo and ZoomInfo export without spending their credits",
              "10-provider waterfall email enrichment, charged only when an email is found",
              "Syntax, MX, SMTP and catch-all email verification before export",
              "Runs in your own session at human pace with a 20,000-row daily cap",
              "Cost preview before every job",
              "Export to CSV, Google Sheets, HubSpot, Salesforce, Instantly, Smartlead, Lemlist, Reachinbox"
            ],
            "offers": [
              {
                "@type": "Offer",
                "name": "Scraping credits",
                "price": "3.00",
                "priceCurrency": "USD",
                "description": "10,000 scraping credits (1 credit per Sales Navigator, Apollo or ZoomInfo row). Pay as you go, credits never expire.",
                "url": "https://www.coldcast.io/pricing",
                "availability": "https://schema.org/InStock"
              },
              {
                "@type": "Offer",
                "name": "Enrichment credits",
                "price": "30.00",
                "priceCurrency": "USD",
                "description": "10,000 enrichment credits, 1 credit per found email.",
                "url": "https://www.coldcast.io/pricing",
                "availability": "https://schema.org/InStock"
              },
              {
                "@type": "Offer",
                "name": "Verification credits",
                "price": "10.00",
                "priceCurrency": "USD",
                "description": "10,000 email verification credits.",
                "url": "https://www.coldcast.io/pricing",
                "availability": "https://schema.org/InStock"
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
