<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0d1116"/>

  <text x="80" y="76" fill="#ffffff" font-size="40" font-weight="800">How waterfall enrichment finds more emails</text>
  <text x="80" y="112" fill="#8b93a0" font-size="22">Single-source lookup vs Coldcast’s provider cascade</text>

  <!-- Single-source row -->
  <text x="80" y="192" fill="#8b93a0" font-size="17" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="3">SINGLE-SOURCE (WIZA)</text>
  <rect x="80" y="215" width="220" height="70" rx="10" fill="#1a2029" stroke="#2a313b"/>
  <text x="102" y="248" fill="#e6e9ee" font-size="20" font-weight="700">Sales Nav lead</text>
  <text x="102" y="270" fill="#8b93a0" font-size="15">1,000 contacts</text>
  <g stroke="#6b7480" fill="#6b7480"><line x1="312" y1="250" x2="352" y2="250" stroke-width="2.5"/><polygon points="352,244 352,256 362,250"/></g>
  <rect x="378" y="215" width="220" height="70" rx="10" fill="#1a2029" stroke="#2a313b"/>
  <text x="400" y="248" fill="#e6e9ee" font-size="20" font-weight="700">Provider A</text>
  <text x="400" y="270" fill="#8b93a0" font-size="15">one lookup</text>
  <g stroke="#6b7480" fill="#6b7480"><line x1="610" y1="250" x2="650" y2="250" stroke-width="2.5"/><polygon points="650,244 650,256 660,250"/></g>
  <rect x="676" y="215" width="290" height="70" rx="10" fill="#151a20" stroke="#242b34"/>
  <text x="698" y="248" fill="#8b93a0" font-size="20" font-weight="700">~650 emails found</text>
  <text x="698" y="270" fill="#6b7480" font-size="15">misses stay empty</text>

  <!-- Waterfall row -->
  <text x="80" y="392" fill="#c3f53c" font-size="17" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="3">WATERFALL (COLDCAST)</text>
  <g>
    <rect x="80" y="415" width="175" height="70" rx="10" fill="#141922" stroke="#c3f53c"/>
    <text x="98" y="448" fill="#e6e9ee" font-size="18" font-weight="700">Sales Nav lead</text>
    <text x="98" y="469" fill="#8b93a0" font-size="14">1,000 contacts</text>
    <rect x="296" y="415" width="175" height="70" rx="10" fill="#141922" stroke="#c3f53c"/>
    <text x="314" y="448" fill="#e6e9ee" font-size="18" font-weight="700">Provider A</text>
    <text x="314" y="469" fill="#8b93a0" font-size="14">then miss ↓</text>
    <rect x="512" y="415" width="175" height="70" rx="10" fill="#141922" stroke="#c3f53c"/>
    <text x="530" y="448" fill="#e6e9ee" font-size="18" font-weight="700">Provider B</text>
    <text x="530" y="469" fill="#8b93a0" font-size="14">then miss ↓</text>
    <rect x="728" y="415" width="175" height="70" rx="10" fill="#141922" stroke="#c3f53c"/>
    <text x="746" y="448" fill="#e6e9ee" font-size="18" font-weight="700">Provider C…</text>
    <text x="746" y="469" fill="#8b93a0" font-size="14">+ verify</text>
    <rect x="944" y="415" width="176" height="70" rx="10" fill="#c3f53c"/>
    <text x="962" y="448" fill="#0d1116" font-size="18" font-weight="800">~850+ verified</text>
    <text x="962" y="469" fill="#0d1116" font-size="14" font-weight="600">emails found</text>
  </g>
  <g stroke="#c3f53c" fill="#c3f53c">
    <line x1="263" y1="450" x2="288" y2="450" stroke-width="2.5"/><polygon points="288,444 288,456 296,450"/>
    <line x1="479" y1="450" x2="504" y2="450" stroke-width="2.5"/><polygon points="504,444 504,456 512,450"/>
    <line x1="695" y1="450" x2="720" y2="450" stroke-width="2.5"/><polygon points="720,444 720,456 728,450"/>
    <line x1="911" y1="450" x2="936" y2="450" stroke-width="2.5"/><polygon points="936,444 936,456 944,450"/>
  </g>

  <text x="80" y="565" fill="#7f8894" font-size="19">Each miss cascades to the next provider — every hit is verified before export. Typical lift: 15–30% more valid emails.</text>
</svg>
