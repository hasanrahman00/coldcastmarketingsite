<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0d1116"/>

  <!-- pill -->
  <rect x="70" y="58" width="232" height="40" rx="20" fill="none" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="186" y="84" text-anchor="middle" fill="#c3f53c" font-size="15" font-weight="700" letter-spacing="1.5">SCRUPP ALTERNATIVE</text>

  <!-- headline -->
  <text x="70" y="176" fill="#ffffff" font-size="58" font-weight="800">The account-safe way to</text>
  <text x="70" y="244" font-size="58" font-weight="800"><tspan fill="#ffffff">export Sales Navigator </tspan><tspan fill="#c3f53c">leads</tspan></text>

  <!-- Coldcast card -->
  <rect x="70" y="300" width="510" height="232" rx="16" fill="#0f1216" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="100" y="348" fill="#c3f53c" font-size="28" font-weight="800">Coldcast</text>
  <g font-size="19" fill="#e6e9ee">
    <text x="100" y="392"><tspan fill="#c3f53c">✓</tspan>  Account-safe scraping by design</text>
    <text x="100" y="427"><tspan fill="#c3f53c">✓</tspan>  Waterfall enrichment, multi-provider</text>
    <text x="100" y="462"><tspan fill="#c3f53c">✓</tspan>  Verified emails on every export</text>
    <text x="100" y="497"><tspan fill="#c3f53c">✓</tspan>  CRM-ready, auto-cleaned CSV</text>
  </g>

  <!-- Scrupp card -->
  <rect x="620" y="300" width="510" height="232" rx="16" fill="#0f1216" stroke="#232a33"/>
  <text x="650" y="348" fill="#8b93a0" font-size="28" font-weight="800">Scrupp</text>
  <g font-size="19" fill="#8b93a0">
    <text x="650" y="392">—  Chrome extension in your session</text>
    <text x="650" y="427">—  Single enrichment pipeline (~65%)</text>
    <text x="650" y="462">—  Credit-based costs add up at scale</text>
    <text x="650" y="497">—  Your account carries the risk</text>
  </g>

  <text x="70" y="592" fill="#7f8894" font-size="18">coldcast.io — the safest LinkedIn Sales Navigator scraper</text>
</svg>
