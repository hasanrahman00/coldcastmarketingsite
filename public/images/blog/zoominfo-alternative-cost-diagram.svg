<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0d1116"/>

  <rect x="72" y="58" width="44" height="8" rx="4" fill="#c3f53c"/>
  <text x="72" y="112" fill="#ffffff" font-size="40" font-weight="800">Cost of a 10,000-lead verified list</text>
  <text x="72" y="152" fill="#8b93a0" font-size="20">Scrape → enrich → verify with Coldcast vs. a ZoomInfo contract</text>

  <!-- Step boxes -->
  <rect x="68" y="210" width="304" height="130" rx="12" fill="#141922" stroke="#232a33"/>
  <text x="96" y="252" fill="#ffffff" font-size="24" font-weight="700">1. Scrape</text>
  <text x="344" y="254" text-anchor="end" fill="#c3f53c" font-size="30" font-weight="800">$3</text>
  <text x="96" y="286" fill="#8b93a0" font-size="16">10,000 Sales Navigator</text>
  <text x="96" y="308" fill="#8b93a0" font-size="16">leads, account-safe</text>

  <rect x="432" y="210" width="304" height="130" rx="12" fill="#141922" stroke="#232a33"/>
  <text x="460" y="252" fill="#ffffff" font-size="24" font-weight="700">2. Enrich</text>
  <text x="708" y="254" text-anchor="end" fill="#c3f53c" font-size="30" font-weight="800">$30</text>
  <text x="460" y="286" fill="#8b93a0" font-size="16">10-provider waterfall,</text>
  <text x="460" y="308" fill="#8b93a0" font-size="16">90–95% email match</text>

  <rect x="796" y="210" width="304" height="130" rx="12" fill="#141922" stroke="#232a33"/>
  <text x="824" y="252" fill="#ffffff" font-size="24" font-weight="700">3. Verify</text>
  <text x="1072" y="254" text-anchor="end" fill="#c3f53c" font-size="30" font-weight="800">$10</text>
  <text x="824" y="286" fill="#8b93a0" font-size="16">Syntax, MX, SMTP,</text>
  <text x="824" y="308" fill="#8b93a0" font-size="16">catch-all checks</text>

  <g stroke="#c3f53c" fill="#c3f53c">
    <line x1="380" y1="275" x2="420" y2="275" stroke-width="4"/><polygon points="420,268 420,282 432,275"/>
    <line x1="744" y1="275" x2="784" y2="275" stroke-width="4"/><polygon points="784,268 784,282 796,275"/>
  </g>

  <!-- Coldcast total -->
  <text x="72" y="417" fill="#ffffff" font-size="22" font-weight="700">Coldcast total</text>
  <rect x="332" y="396" width="36" height="26" rx="6" fill="#c3f53c"/>
  <text x="384" y="417" fill="#c3f53c" font-size="24" font-weight="800">~$43 in credits</text>

  <!-- ZoomInfo entry tier -->
  <text x="72" y="487" fill="#ffffff" font-size="22" font-weight="700">ZoomInfo entry tier</text>
  <rect x="332" y="466" width="768" height="26" rx="6" fill="#2a313b"/>
  <text x="332" y="527" fill="#8b93a0" font-size="20" font-weight="700">~$14,995 / year — 2,500 credits covers a quarter of the list</text>

  <text x="72" y="590" fill="#7f8894" font-size="17">Pay-as-you-go credits never expire • coldcast.io</text>
</svg>
