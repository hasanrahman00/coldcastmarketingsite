<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0a0e14"/>
  <circle cx="1080" cy="150" r="230" fill="#ffffff" fill-opacity="0.02"/>

  <!-- eyebrow -->
  <text x="80" y="118" fill="#c3f53c" font-size="20" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="4">COLDCAST &#183; LEGAL GUIDE</text>

  <!-- headline -->
  <text x="80" y="196" fill="#ffffff" font-size="60" font-weight="800">Is LinkedIn scraping</text>
  <text x="80" y="266" font-size="60" font-weight="800"><tspan fill="#ffffff">legal? </tspan><tspan fill="#c3f53c">The 2026 verdict.</tspan></text>

  <!-- scales of justice icon (top-right) -->
  <g stroke="#c3f53c" fill="none" stroke-linecap="round">
    <circle cx="1012" cy="86" r="6" fill="#c3f53c" stroke="none"/>
    <line x1="1012" y1="90" x2="1012" y2="196" stroke-width="5"/>
    <line x1="936" y1="120" x2="1088" y2="120" stroke-width="5"/>
    <line x1="978" y1="198" x2="1046" y2="198" stroke-width="5"/>
    <!-- left pan -->
    <line x1="936" y1="120" x2="912" y2="166" stroke-width="2.5"/>
    <line x1="936" y1="120" x2="960" y2="166" stroke-width="2.5"/>
    <path d="M900 166 Q936 206 972 166" stroke-width="4"/>
    <!-- right pan -->
    <line x1="1088" y1="120" x2="1064" y2="166" stroke-width="2.5"/>
    <line x1="1088" y1="120" x2="1112" y2="166" stroke-width="2.5"/>
    <path d="M1052 166 Q1088 206 1124 166" stroke-width="4"/>
  </g>

  <!-- verdict cards -->
  <g>
    <!-- Criminal law -->
    <rect x="80" y="392" width="336" height="176" rx="14" fill="#12161d" stroke="#232a33"/>
    <text x="112" y="440" fill="#8b93a0" font-size="16" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="2">CRIMINAL LAW</text>
    <text x="112" y="482" fill="#c3f53c" font-size="33" font-weight="800">Not a crime</text>
    <text x="112" y="520" fill="#8b93a0" font-size="17">hiQ v. LinkedIn (9th Cir.)</text>

    <!-- LinkedIn ToS -->
    <rect x="432" y="392" width="336" height="176" rx="14" fill="#12161d" stroke="#232a33"/>
    <text x="464" y="440" fill="#8b93a0" font-size="16" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="2">LINKEDIN ToS</text>
    <text x="464" y="482" fill="#ffffff" font-size="33" font-weight="800">Account risk</text>
    <text x="464" y="520" fill="#8b93a0" font-size="17">Bans, not lawsuits</text>

    <!-- GDPR / CCPA -->
    <rect x="784" y="392" width="336" height="176" rx="14" fill="#12161d" stroke="#232a33"/>
    <text x="816" y="440" fill="#8b93a0" font-size="16" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="2">GDPR / CCPA</text>
    <text x="816" y="482" fill="#ffffff" font-size="33" font-weight="800">Compliant B2B</text>
    <text x="816" y="520" fill="#8b93a0" font-size="17">Legitimate interest</text>
  </g>
</svg>
