<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0a0e14"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- header -->
  <text x="64" y="82" font-size="22" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1"><tspan fill="#c3f53c">coldcast</tspan><tspan fill="#6b7480"> / blog</tspan></text>

  <!-- headline -->
  <text x="64" y="158" fill="#ffffff" font-size="62" font-weight="800">Is LinkedIn scraping</text>
  <text x="64" y="228" font-size="62" font-weight="800"><tspan fill="#ffffff">legal? </tspan><tspan fill="#c3f53c">The 2026 answer</tspan></text>
  <text x="64" y="276" fill="#9aa3ad" font-size="22">hiQ v. LinkedIn &#183; Van Buren &#183; Proxycurl &#183; GDPR &#8212; what actually matters</text>

  <!-- scales of justice icon -->
  <g>
    <rect x="900" y="56" width="176" height="176" rx="20" fill="#12161d" stroke="#232a33"/>
    <g stroke="#c3f53c" stroke-width="5" stroke-linecap="round">
      <circle cx="988" cy="96" r="6" fill="#c3f53c" stroke="none"/>
      <line x1="988" y1="98" x2="988" y2="176"/>
      <line x1="934" y1="116" x2="1042" y2="116"/>
      <line x1="962" y1="178" x2="1014" y2="178"/>
    </g>
    <g stroke="#c3f53c" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="934" y1="116" x2="916" y2="150"/>
      <line x1="934" y1="116" x2="952" y2="150"/>
      <line x1="1042" y1="116" x2="1024" y2="150"/>
      <line x1="1042" y1="116" x2="1060" y2="150"/>
    </g>
    <g stroke="#9aa3ad" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M910 150 Q934 178 958 150"/>
      <path d="M1018 150 Q1042 178 1066 150"/>
    </g>
  </g>

  <!-- timeline -->
  <line x1="134" y1="440" x2="1150" y2="440" stroke="#2a313b" stroke-width="2"/>
  <g fill="#c3f53c">
    <circle cx="150" cy="440" r="7"/>
    <circle cx="430" cy="440" r="7"/>
    <circle cx="710" cy="440" r="7"/>
    <circle cx="990" cy="440" r="7"/>
  </g>

  <!-- timeline cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- 2019 -->
    <rect x="134" y="470" width="212" height="104" rx="10" fill="#10141a" stroke="#1c222b"/>
    <text x="152" y="506" fill="#c3f53c" font-size="26" font-weight="800">2019</text>
    <text x="152" y="534" fill="#c4cbd4" font-size="16">hiQ wins: public</text>
    <text x="152" y="556" fill="#c4cbd4" font-size="16">scraping not a crime</text>
    <!-- 2021 -->
    <rect x="414" y="470" width="212" height="104" rx="10" fill="#10141a" stroke="#1c222b"/>
    <text x="432" y="506" fill="#c3f53c" font-size="26" font-weight="800">2021</text>
    <text x="432" y="534" fill="#c4cbd4" font-size="16">Van Buren narrows</text>
    <text x="432" y="556" fill="#c4cbd4" font-size="16">the CFAA</text>
    <!-- 2022 -->
    <rect x="694" y="470" width="212" height="104" rx="10" fill="#10141a" stroke="#1c222b"/>
    <text x="712" y="506" fill="#c3f53c" font-size="26" font-weight="800">2022</text>
    <text x="712" y="534" fill="#c4cbd4" font-size="16">hiQ breached ToS &#8212;</text>
    <text x="712" y="556" fill="#c4cbd4" font-size="16">contract claims win</text>
    <!-- 2025 -->
    <rect x="974" y="470" width="212" height="104" rx="10" fill="#10141a" stroke="#1c222b"/>
    <text x="992" y="506" fill="#c3f53c" font-size="26" font-weight="800">2025</text>
    <text x="992" y="534" fill="#c4cbd4" font-size="16">LinkedIn sues Proxycurl;</text>
    <text x="992" y="556" fill="#c4cbd4" font-size="16">data resellers settle</text>
  </g>
</svg>
