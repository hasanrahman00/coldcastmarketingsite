<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0d1116"/>

  <text x="80" y="80" fill="#c3f53c" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="5">HOW WATERFALL ENRICHMENT WORKS</text>
  <text x="80" y="136" fill="#ffffff" font-size="40" font-weight="800">One contact in, the first verified email out</text>

  <!-- flow row -->
  <g stroke="#c3f53c" fill="#c3f53c">
    <g><line x1="308" y1="294" x2="342" y2="294" stroke-width="3"/><polygon points="342,288 342,300 352,294"/></g>
    <g><line x1="580" y1="294" x2="614" y2="294" stroke-width="3"/><polygon points="614,288 614,300 624,294"/></g>
    <g><line x1="852" y1="294" x2="886" y2="294" stroke-width="3"/><polygon points="886,288 886,300 896,294"/></g>
  </g>

  <rect x="80" y="248" width="222" height="92" rx="12" fill="#141922" stroke="#2a313b"/>
  <text x="104" y="290" fill="#e6e9ee" font-size="19" font-weight="700">Lead from</text>
  <text x="104" y="314" fill="#e6e9ee" font-size="19" font-weight="700">Sales Navigator</text>

  <rect x="352" y="248" width="222" height="92" rx="12" fill="#141922" stroke="#2a313b"/>
  <text x="376" y="290" fill="#e6e9ee" font-size="20" font-weight="700">Provider 1</text>
  <text x="376" y="316" fill="#8b93a0" font-size="16">✗ no match</text>

  <rect x="624" y="248" width="222" height="92" rx="12" fill="#141922" stroke="#2a313b"/>
  <text x="648" y="290" fill="#e6e9ee" font-size="20" font-weight="700">Provider 2</text>
  <text x="648" y="316" fill="#8b93a0" font-size="16">✗ catch-all</text>

  <rect x="896" y="248" width="212" height="92" rx="12" fill="#141922" stroke="#c3f53c" stroke-width="2"/>
  <text x="920" y="290" fill="#c3f53c" font-size="20" font-weight="800">Provider 3</text>
  <text x="920" y="316" fill="#e6e9ee" font-size="16">✓ email found</text>

  <!-- down arrow to verify -->
  <g stroke="#c3f53c" fill="#c3f53c">
    <line x1="1002" y1="340" x2="1002" y2="444" stroke-width="3"/><polygon points="996,444 1008,444 1002,454"/>
  </g>

  <!-- bottom-left context -->
  <rect x="80" y="452" width="620" height="104" rx="12" fill="#141922" stroke="#232a33"/>
  <text x="112" y="496" fill="#e6e9ee" font-size="20" font-weight="700">Single-engine tools stop at the first miss</text>
  <text x="112" y="524" fill="#8b93a0" font-size="16">Waterfall keeps cascading until a verified email is found</text>

  <!-- verify result -->
  <rect x="790" y="452" width="330" height="104" rx="12" fill="#c3f53c"/>
  <text x="820" y="498" fill="#0d1116" font-size="22" font-weight="800">Coldcast Email Verify</text>
  <text x="820" y="526" fill="#0d1116" font-size="16" font-weight="600">✓ deliverable — in your CSV</text>

  <text x="80" y="600" fill="#7f8894" font-size="19">coldcast.io/products/waterfall-enricher</text>
</svg>
