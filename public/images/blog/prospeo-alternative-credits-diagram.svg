<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0d1116"/>

  <text x="80" y="72" fill="#ffffff" font-size="38" font-weight="800">Single-source lookup vs waterfall enrichment</text>
  <text x="80" y="110" fill="#8b93a0" font-size="22">Why one index misses emails a waterfall finds</text>

  <!-- Left: single source -->
  <rect x="80" y="168" width="470" height="390" rx="16" fill="#141922" stroke="#232a33"/>
  <text x="112" y="216" fill="#8b93a0" font-size="22" font-weight="700">Single source (Prospeo)</text>

  <rect x="128" y="248" width="376" height="58" rx="8" fill="#0d1116" stroke="#2a313b"/>
  <text x="316" y="284" text-anchor="middle" fill="#e6e9ee" font-size="20">1,000 leads in</text>

  <rect x="128" y="352" width="376" height="58" rx="8" fill="#0d1116" stroke="#2a313b"/>
  <text x="316" y="388" text-anchor="middle" fill="#e6e9ee" font-size="20">One database checked</text>

  <rect x="128" y="456" width="376" height="80" rx="8" fill="#0d1116" stroke="#2a313b"/>
  <text x="316" y="490" text-anchor="middle" fill="#8b93a0" font-size="20">No match = no email</text>
  <text x="316" y="514" text-anchor="middle" fill="#6b7280" font-size="14">match rate varies by index coverage</text>

  <g stroke="#4b5563" fill="#4b5563">
    <line x1="316" y1="310" x2="316" y2="336" stroke-width="3"/><polygon points="310,336 322,336 316,345"/>
    <line x1="316" y1="414" x2="316" y2="440" stroke-width="3"/><polygon points="310,440 322,440 316,449"/>
  </g>

  <!-- Right: waterfall -->
  <rect x="638" y="168" width="482" height="390" rx="16" fill="#0f1216" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="668" y="216" fill="#c3f53c" font-size="22" font-weight="700">Coldcast waterfall</text>

  <rect x="688" y="246" width="384" height="46" rx="8" fill="#0d1116" stroke="#c3f53c"/>
  <text x="880" y="275" text-anchor="middle" fill="#e6e9ee" font-size="18">Provider 1 → verified hit? keep</text>

  <rect x="688" y="326" width="384" height="46" rx="8" fill="#0d1116" stroke="#c3f53c"/>
  <text x="880" y="355" text-anchor="middle" fill="#e6e9ee" font-size="18">Provider 2 → verified hit? keep</text>

  <rect x="688" y="406" width="384" height="46" rx="8" fill="#0d1116" stroke="#c3f53c"/>
  <text x="880" y="435" text-anchor="middle" fill="#e6e9ee" font-size="18">Provider 3+ → last-chance lookup</text>

  <rect x="688" y="486" width="384" height="48" rx="8" fill="#c3f53c"/>
  <text x="880" y="516" text-anchor="middle" fill="#0d1116" font-size="19" font-weight="800">30–50% more verified emails</text>

  <g stroke="#c3f53c" fill="#c3f53c">
    <line x1="880" y1="294" x2="880" y2="314" stroke-width="3"/><polygon points="874,314 886,314 880,323"/>
    <line x1="880" y1="374" x2="880" y2="394" stroke-width="3"/><polygon points="874,394 886,394 880,403"/>
    <line x1="880" y1="454" x2="880" y2="474" stroke-width="3"/><polygon points="874,474 886,474 880,483"/>
  </g>

  <text x="80" y="600" fill="#8b93a0" font-size="20">Every result verified before export — pay only for emails that land.</text>
</svg>
