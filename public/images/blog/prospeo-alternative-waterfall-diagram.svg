<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0d1116"/>
  <circle cx="1090" cy="470" r="180" fill="#c3f53c" fill-opacity="0.03"/>

  <text x="80" y="66" fill="#c3f53c" font-size="19" font-weight="800" letter-spacing="4">WATERFALL ENRICHMENT</text>
  <text x="80" y="112" fill="#ffffff" font-size="40" font-weight="800">Multiple sources beat one database</text>

  <!-- Row 1: single-source finder -->
  <text x="80" y="182" fill="#8b93a0" font-size="19" font-weight="700">Single-source finder</text>

  <rect x="80" y="200" width="200" height="80" rx="10" fill="#141922" stroke="#2a313b"/>
  <text x="180" y="246" text-anchor="middle" fill="#e6e9ee" font-size="20">Lead list</text>

  <rect x="365" y="200" width="200" height="80" rx="10" fill="#141922" stroke="#2a313b"/>
  <text x="465" y="234" text-anchor="middle" fill="#e6e9ee" font-size="20">One database</text>
  <text x="465" y="258" text-anchor="middle" fill="#8b93a0" font-size="14">hit or miss</text>

  <rect x="650" y="200" width="240" height="80" rx="10" fill="#0f1216" stroke="#232a33"/>
  <text x="770" y="234" text-anchor="middle" fill="#8b93a0" font-size="20">Misses = dead ends</text>
  <text x="770" y="258" text-anchor="middle" fill="#6b7280" font-size="14">no fallback source</text>

  <g stroke="#4b5563" fill="#4b5563">
    <line x1="288" y1="240" x2="352" y2="240" stroke-width="3"/><polygon points="352,234 352,246 362,240"/>
    <line x1="573" y1="240" x2="637" y2="240" stroke-width="3"/><polygon points="637,234 637,246 647,240"/>
  </g>

  <!-- Row 2: Coldcast waterfall -->
  <text x="80" y="347" fill="#c3f53c" font-size="19" font-weight="700">Coldcast waterfall</text>

  <rect x="80" y="365" width="180" height="80" rx="10" fill="#0f1216" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="170" y="411" text-anchor="middle" fill="#e6e9ee" font-size="19">Lead list</text>

  <rect x="325" y="365" width="170" height="80" rx="10" fill="#0f1216" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="410" y="399" text-anchor="middle" fill="#e6e9ee" font-size="19">Source 1</text>
  <text x="410" y="421" text-anchor="middle" fill="#8b93a0" font-size="13">miss? cascade</text>

  <rect x="560" y="365" width="170" height="80" rx="10" fill="#0f1216" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="645" y="399" text-anchor="middle" fill="#e6e9ee" font-size="19">Source 2</text>
  <text x="645" y="421" text-anchor="middle" fill="#8b93a0" font-size="13">miss? cascade</text>

  <rect x="795" y="365" width="170" height="80" rx="10" fill="#0f1216" stroke="#c3f53c" stroke-width="1.5"/>
  <text x="880" y="399" text-anchor="middle" fill="#e6e9ee" font-size="19">Source 3+</text>
  <text x="880" y="421" text-anchor="middle" fill="#8b93a0" font-size="13">until verified</text>

  <rect x="1030" y="365" width="120" height="80" rx="10" fill="#c3f53c"/>
  <text x="1090" y="399" text-anchor="middle" fill="#0d1116" font-size="19" font-weight="800">Verified</text>
  <text x="1090" y="423" text-anchor="middle" fill="#0d1116" font-size="19" font-weight="800">email</text>

  <g stroke="#c3f53c" fill="#c3f53c">
    <line x1="268" y1="405" x2="316" y2="405" stroke-width="3"/><polygon points="316,399 316,411 326,405"/>
    <line x1="503" y1="405" x2="551" y2="405" stroke-width="3"/><polygon points="551,399 551,411 561,405"/>
    <line x1="738" y1="405" x2="786" y2="405" stroke-width="3"/><polygon points="786,399 786,411 796,405"/>
    <line x1="973" y1="405" x2="1021" y2="405" stroke-width="3"/><polygon points="1021,399 1021,411 1031,405"/>
  </g>

  <!-- Benefit cards -->
  <rect x="80" y="495" width="330" height="72" rx="10" fill="#141922" stroke="#232a33"/>
  <text x="100" y="524" fill="#c3f53c" font-size="17" font-weight="700">Higher match rate</text>
  <text x="100" y="548" fill="#8b93a0" font-size="14">no single provider covers everyone</text>

  <rect x="435" y="495" width="330" height="72" rx="10" fill="#141922" stroke="#232a33"/>
  <text x="455" y="524" fill="#c3f53c" font-size="17" font-weight="700">Pay for results</text>
  <text x="455" y="548" fill="#8b93a0" font-size="14">cascade stops at first verified hit</text>

  <rect x="790" y="495" width="330" height="72" rx="10" fill="#141922" stroke="#232a33"/>
  <text x="810" y="524" fill="#c3f53c" font-size="17" font-weight="700">Verified + phones built in</text>
  <text x="810" y="548" fill="#8b93a0" font-size="14">not a 10-credit add-on</text>
</svg>
