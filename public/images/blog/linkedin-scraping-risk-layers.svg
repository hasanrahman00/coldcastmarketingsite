<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0a0e14"/>

  <!-- header -->
  <text x="80" y="92" fill="#ffffff" font-size="44" font-weight="800">The 3 layers of LinkedIn scraping risk</text>
  <text x="80" y="132" fill="#8b93a0" font-size="21">Each layer answers a different question &#8212; only one is a daily risk</text>

  <!-- Row 1: Criminal law -->
  <g>
    <rect x="80" y="176" width="1040" height="112" rx="14" fill="#12161d" stroke="#232a33"/>
    <rect x="80" y="188" width="6" height="88" rx="3" fill="#3a424d"/>
    <text x="120" y="222" fill="#ffffff" font-size="27" font-weight="800">1 &#183; Criminal law (CFAA)</text>
    <text x="120" y="256" fill="#8b93a0" font-size="19">Public-data scraping is not hacking (hiQ v. LinkedIn)</text>
    <rect x="922" y="210" width="158" height="46" rx="23" fill="#1a1f27" stroke="#2c333d"/>
    <text x="1001" y="239" fill="#9aa3ad" font-size="16" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1" text-anchor="middle">NO RISK</text>
  </g>

  <!-- Row 2: LinkedIn ToS (the real risk) -->
  <g>
    <rect x="80" y="308" width="1040" height="112" rx="14" fill="#12161d" stroke="#2f3a1b"/>
    <rect x="80" y="320" width="6" height="88" rx="3" fill="#c3f53c"/>
    <text x="120" y="354" fill="#ffffff" font-size="27" font-weight="800">2 &#183; LinkedIn&#8217;s terms of service</text>
    <text x="120" y="388" fill="#8b93a0" font-size="19">Detectable automation gets accounts restricted</text>
    <rect x="908" y="342" width="172" height="46" rx="23" fill="#c3f53c"/>
    <text x="994" y="371" fill="#0a0e14" font-size="16" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1" text-anchor="middle">REAL RISK</text>
  </g>

  <!-- Row 3: Privacy law -->
  <g>
    <rect x="80" y="440" width="1040" height="112" rx="14" fill="#12161d" stroke="#232a33"/>
    <rect x="80" y="452" width="6" height="88" rx="3" fill="#3a424d"/>
    <text x="120" y="486" fill="#ffffff" font-size="27" font-weight="800">3 &#183; Privacy law (GDPR / CCPA)</text>
    <text x="120" y="520" fill="#8b93a0" font-size="19">B2B outreach is lawful under legitimate interest</text>
    <rect x="900" y="474" width="180" height="46" rx="23" fill="#1a1f27" stroke="#2c333d"/>
    <text x="990" y="503" fill="#9aa3ad" font-size="16" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1" text-anchor="middle">MANAGEABLE</text>
  </g>

  <!-- footer -->
  <text x="80" y="600" fill="#7f8894" font-size="18">coldcast.io &#8212; the account-safe Sales Navigator scraper</text>
</svg>
