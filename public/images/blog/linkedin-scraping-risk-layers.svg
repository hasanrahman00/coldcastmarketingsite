<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#0a0e14"/>
  <!-- header -->
  <text x="64" y="76" fill="#c3f53c" font-size="22" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1">coldcast</text>
  <text x="64" y="138" fill="#ffffff" font-size="46" font-weight="800">The 3 layers of LinkedIn scraping risk</text>
  <text x="64" y="178" fill="#9aa3ad" font-size="22">Same word &#8212; &#8220;legal&#8221; &#8212; three very different questions</text>

  <!-- Card 1: Criminal -->
  <g>
    <rect x="64" y="216" width="340" height="332" rx="14" fill="#12161d" stroke="#232a33"/>
    <rect x="76" y="214" width="316" height="4" rx="2" fill="#35d27a"/>
    <text x="92" y="266" fill="#35d27a" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="2">LAYER 1 &#183; CRIMINAL</text>
    <text x="92" y="304" fill="#ffffff" font-size="27" font-weight="800">CFAA / hacking law</text>
    <text x="92" y="348" fill="#9aa3ad" font-size="18">Scraping data you can</text>
    <text x="92" y="374" fill="#9aa3ad" font-size="18">lawfully see is not a</text>
    <text x="92" y="400" fill="#9aa3ad" font-size="18">crime (hiQ, Van Buren).</text>
    <rect x="92" y="470" width="150" height="42" rx="21" fill="none" stroke="#35d27a" stroke-width="1.5"/>
    <text x="167" y="497" fill="#35d27a" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1" text-anchor="middle">LOW RISK</text>
  </g>

  <!-- Card 2: Civil -->
  <g>
    <rect x="430" y="216" width="340" height="332" rx="14" fill="#12161d" stroke="#232a33"/>
    <rect x="442" y="214" width="316" height="4" rx="2" fill="#f5b23c"/>
    <text x="458" y="266" fill="#f5b23c" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="2">LAYER 2 &#183; CIVIL</text>
    <text x="458" y="304" fill="#ffffff" font-size="27" font-weight="800">ToS &amp; contract claims</text>
    <text x="458" y="348" fill="#9aa3ad" font-size="18">LinkedIn sues companies</text>
    <text x="458" y="374" fill="#9aa3ad" font-size="18">that resell its data at</text>
    <text x="458" y="400" fill="#9aa3ad" font-size="18">scale (hiQ, Proxycurl).</text>
    <rect x="458" y="470" width="176" height="42" rx="21" fill="none" stroke="#f5b23c" stroke-width="1.5"/>
    <text x="546" y="497" fill="#f5b23c" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1" text-anchor="middle">VENDOR RISK</text>
  </g>

  <!-- Card 3: Platform -->
  <g>
    <rect x="796" y="216" width="340" height="332" rx="14" fill="#12161d" stroke="#232a33"/>
    <rect x="808" y="214" width="316" height="4" rx="2" fill="#c3f53c"/>
    <text x="824" y="266" fill="#c3f53c" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="2">LAYER 3 &#183; PLATFORM</text>
    <text x="824" y="304" fill="#ffffff" font-size="27" font-weight="800">Account restriction</text>
    <text x="824" y="348" fill="#9aa3ad" font-size="18">The real everyday risk.</text>
    <text x="824" y="374" fill="#9aa3ad" font-size="18">Driven by speed, IPs and</text>
    <text x="824" y="400" fill="#9aa3ad" font-size="18">bot-like automation.</text>
    <rect x="824" y="470" width="150" height="42" rx="21" fill="#c3f53c"/>
    <text x="899" y="497" fill="#0a0e14" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', monospace" letter-spacing="1" text-anchor="middle">YOUR RISK</text>
  </g>

  <!-- footer (corrected: no "cloud sessions, no browser extension") -->
  <text x="600" y="600" fill="#7f8894" font-size="18" text-anchor="middle">Coldcast is built for Layer 3: human-like pacing, your own session &amp; IP &#8212; no cloud bots.</text>
</svg>
